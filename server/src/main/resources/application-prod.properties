# ============================================================
# prod 프로필: 실제 서버
#  - 실행: java -jar app.jar --spring.profiles.active=prod  (또는 환경변수 SPRING_PROFILES_ACTIVE=prod)
#  - 개발용 테스트 API(POST /api/v1/games)는 꺼진다.
#  - 비밀 값은 반드시 환경변수로 넣는다. (없으면 서버가 시작되지 않는다)
# ============================================================

# JWT 비밀키: 환경변수 JWT_SECRET 필수 (기본값 없음)
jwt.secret=${JWT_SECRET}

# DB 계정: 환경변수 필수 (공통 설정의 로컬 기본값을 쓰지 않도록 덮어쓴다)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# 서버 모드. 운영은 우선 single(서버 1대, 전부 서버 메모리). Redis 쪽을 충분히 확인한 뒤 SERVER_MODE=multi로 바꾼다.
# 항목 하나만 바꿔 보려면 GAME_REPOSITORY / GAME_LOCK / ROOM_LOCK / GAME_TIMER / GAME_ACTIVITY 환경변수로 덮어쓴다. (공통 설정 application.properties 참고)
mafia.server.mode=${SERVER_MODE:single}

# 실제 게임 진행 시간(초)
mafia.phase.night-seconds=30
mafia.phase.night-result-seconds=5
mafia.phase.day-seconds=60
# 낮 토론 시간 연장 한 번에 늘어나는 시간 (살아 있는 사람마다 낮에 한 번)
mafia.phase.day-extend-seconds=10
mafia.phase.vote-seconds=30
mafia.phase.execution-seconds=5

# 끝나지 않는 게임 방지
#  - 게임 상태 조회가 이 시간(초) 동안 없으면 연결이 끊긴 것으로 보고 사망 처리 + 방에서 제외 (검사 주기: inactive-check-seconds)
#  - 이 일수 동안 연속으로 아무도 죽지 않으면 그날 투표 결과 직후 게임 취소
mafia.phase.inactive-timeout-seconds=60
mafia.phase.inactive-check-seconds=5
mafia.phase.max-days-without-death=10

# 구글 OAuth 클라이언트 ID: 환경변수 GOOGLE_CLIENT_ID 필수 (없으면 서버가 시작되지 않는다)
oauth.google.client-id=${GOOGLE_CLIENT_ID}

# 웹(WebGL) 로그인용 (모바일만 쓰면 비워도 된다).
# KAKAO_ALLOWED_REDIRECT_URIS = 이 서버의 콜백 페이지 주소. 예) https://3-38-222-51.sslip.io/kakao-callback.html
oauth.google.client-secret=${GOOGLE_CLIENT_SECRET:}
oauth.kakao.rest-api-key=${KAKAO_REST_API_KEY:}
oauth.kakao.client-secret=${KAKAO_CLIENT_SECRET:}
oauth.kakao.allowed-redirect-uris=${KAKAO_ALLOWED_REDIRECT_URIS:}
