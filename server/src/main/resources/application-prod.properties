# ============================================================
# prod 프로필: 실제 서버
#  - 실행: java -jar app.jar --spring.profiles.active=prod  (또는 환경변수 SPRING_PROFILES_ACTIVE=prod)
#  - 개발용 테스트 API(POST /api/v1/games)는 꺼진다.
#  - 비밀 값은 반드시 환경변수로 넣는다. (없으면 서버가 시작되지 않는다)
# ============================================================

# JWT 비밀키: 환경변수 JWT_SECRET 필수 (기본값 없음)
jwt.secret=${JWT_SECRET}

# DB 계정: 환경변수 필수 (공통 설정의 로컬 기본값을 쓰지 않도록 덮어쓴다)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# 실제 게임 진행 시간(초)
mafia.phase.night-seconds=30
mafia.phase.night-result-seconds=5
mafia.phase.day-seconds=60
mafia.phase.vote-seconds=30
mafia.phase.execution-seconds=5

# 끝나지 않는 게임 방지
#  - 게임 상태 조회가 이 시간(초) 동안 없으면 연결이 끊긴 것으로 보고 사망 처리 + 방에서 제외 (검사 주기: inactive-check-seconds)
#  - 이 일수 동안 연속으로 아무도 죽지 않으면 그날 투표 결과 직후 게임 취소
mafia.phase.inactive-timeout-seconds=60
mafia.phase.inactive-check-seconds=5
mafia.phase.max-days-without-death=10
