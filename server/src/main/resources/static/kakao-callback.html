<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Kakao Login Callback</title>
    <!--
        카카오 로그인 팝업이 돌아오는 페이지. (Redirect URI = 이 서버의 /kakao-callback.html)
        URL의 ?code=...&state=... 를 게임 창(팝업을 연 창)에 전달하고 스스로 닫는다.

        왜 서버에 두나: itch.io는 게임을 업로드 번호가 들어간 주소(html-classic.itch.zone/html/번호/...)에서 실행하고
        이 번호는 새 빌드를 올릴 때마다 바뀔 수 있다. 콜백 주소가 그때마다 바뀌면 카카오 콘솔·서버 설정을 계속 고쳐야 하므로
        바뀌지 않는 이 서버 주소 하나로 고정한다. (게임과 다른 출처라 postMessage로 전달한다)

        보안: 코드를 보낼 곳(게임 출처)은 state의 마지막 부분("랜덤.게임출처(base64url)")에 담겨 있다.
        아무 곳에나 보내면 안 되므로, 아래 허용 목록과 맞는 출처로만 보낸다.
        게임(SocialAuthWeb.jslib)은 자기가 만든 state와 같을 때만 코드를 받아들인다.
    -->
    <script>
        // 코드를 받을 수 있는 게임 출처: itch.io 게임 실행 도메인, 로컬 테스트
        var ALLOWED_ORIGINS = [
            /^https:\/\/([a-z0-9-]+\.)?itch\.zone$/,
            /^https:\/\/([a-z0-9-]+\.)?hwcdn\.net$/,
            /^http:\/\/localhost(:\d+)?$/,
            /^http:\/\/127\.0\.0\.1(:\d+)?$/
        ];

        function decodeOrigin(state) {
            try {
                var part = (state || '').split('.')[1];
                if (!part) return null;
                part = part.replace(/-/g, '+').replace(/_/g, '/');
                while (part.length % 4) part += '=';
                return atob(part);
            } catch (e) {
                return null;
            }
        }

        function isAllowed(origin) {
            return !!origin && ALLOWED_ORIGINS.some(function (re) { return re.test(origin); });
        }

        window.onload = function () {
            var params = new URLSearchParams(window.location.search);
            var state = params.get('state');
            var message = {
                type: 'KAKAO_AUTH_RESULT',
                code: params.get('code'),
                state: state,
                error: params.get('error') // 사용자가 동의를 취소하면 access_denied
            };

            var target = decodeOrigin(state);
            var status = document.getElementById('status');

            if (!isAllowed(target) || !window.opener) {
                status.textContent = '로그인 결과를 게임으로 전달하지 못했습니다. 이 창을 닫고 게임에서 다시 시도해 주세요.';
                return;
            }

            try {
                window.opener.postMessage(message, target);
            } catch (e) {
                status.textContent = '로그인 결과를 게임으로 전달하지 못했습니다. 이 창을 닫고 게임에서 다시 시도해 주세요.';
                return;
            }
            window.close();
        };
    </script>
</head>
<body>
    <p id="status">로그인 처리 중입니다...</p>
</body>
</html>
