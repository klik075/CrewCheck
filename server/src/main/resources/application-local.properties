#  - 개발용 테스트 API(POST /api/v1/games, DevGameController)가 켜진다.
# ============================================================

# JWT 비밀키 (로컬 전용 값. 실제 서버에서는 prod 프로필에서 환경변수로 받는다)
jwt.secret=${JWT_SECRET:c29tZS1zZWNyZXQta2V5LXZlcnktc3Ryb25nLWFuZC1zZWN1cmUtZm9yLWp3dC10b2tlbi1leGFtcGxlCg==}

# Postman으로 한 단계씩 요청을 보낼 수 있도록 밤/투표 시간을 길게 둔다.
# (전원이 제출하면 시간이 남아도 바로 다음 페이즈로 넘어간다)
mafia.phase.night-seconds=300
mafia.phase.night-result-seconds=5
mafia.phase.day-seconds=5
mafia.phase.vote-seconds=300
mafia.phase.execution-seconds=5

# 연결 끊김 검사는 끈다. Postman은 게임 상태를 1초마다 조회하지 않아서 켜 두면 플레이어가 모두 미접속으로 처리된다.
# Unity 클라이언트로 로컬 테스트할 때 확인하려면 60 등으로 바꾼다.
mafia.phase.inactive-timeout-seconds=0
