# ============================================================
# loadtest 프로필: 로컬 부하 테스트용 지표 노출
#  - 다른 프로필과 함께 켠다: spring.profiles.active=local,loadtest
#  - 운영(prod)에서는 켜지 않는다. 지표 주소가 인증 없이 열린다.
# ============================================================

# 지표 주소 열기 (기본은 health만)
#  - /actuator/metrics/{이름} : 지표 하나를 사람이 읽기 쉬운 JSON으로 확인
#  - /actuator/prometheus     : Prometheus가 긁어 가는 형식
management.endpoints.web.exposure.include=health,metrics,prometheus

# Tomcat 내부 상태(JMX MBean)를 켠다. 이게 꺼져 있으면 tomcat.threads.* 지표가 나오지 않는다
#  - tomcat.threads.busy        : 지금 요청을 처리 중인 스레드 수 (스레드 고갈의 핵심 증거)
#  - tomcat.threads.config.max  : 스레드 풀 최대 크기 (기본 200)
#  - tomcat.threads.current     : 지금 만들어져 있는 스레드 수
server.tomcat.mbeanregistry.enabled=true

# HTTP 요청 응답시간을 구간별로 모은다. Prometheus/Grafana에서 p95·p99를 계산할 수 있게 된다
management.metrics.distribution.percentiles-histogram.http.server.requests=true
