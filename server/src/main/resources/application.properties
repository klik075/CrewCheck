spring.application.name=WhoisntCitizen_server

# 실제 적용할 설정 값
# mafia.phase.night-seconds=30
# mafia.phase.night-result-seconds=5
# mafia.phase.day-seconds=60
# mafia.phase.vote-seconds=30
# mafia.phase.execution-seconds=5

# Postman 테스트 설정 값
mafia.phase.night-seconds=300
mafia.phase.night-result-seconds=5
mafia.phase.day-seconds=5
mafia.phase.vote-seconds=300
mafia.phase.execution-seconds=5

server.port=8080

# JWT 설정
jwt.secret=c29tZS1zZWNyZXQta2V5LXZlcnktc3Ryb25nLWFuZC1zZWN1cmUtZm9yLWp3dC10b2tlbi1leGFtcGxlCg==
jwt.expiration=3600000

# DB (MySQL, docker-compose.yml 기준 기본값)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/mafia?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
spring.datasource.username=${DB_USER:mafia}
spring.datasource.password=${DB_PASSWORD:mafia1234}
# 테이블은 Flyway(src/main/resources/db/migration)가 만든다. Hibernate는 스키마를 건드리지 않는다.
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

