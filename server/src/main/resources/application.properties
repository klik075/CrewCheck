spring.application.name=WhoisntCitizen_server

# 실제 적용할 설정 값
# mafia.phase.night-seconds=30
# mafia.phase.night-result-seconds=5
# mafia.phase.day-seconds=60
# mafia.phase.vote-seconds=30
# mafia.phase.execution-seconds=5

# Postman 테스트 설정 값
mafia.phase.night-seconds=300
mafia.phase.night-result-seconds=5
mafia.phase.day-seconds=5
mafia.phase.vote-seconds=300
mafia.phase.execution-seconds=5

server.port=8080

# JWT 설정
jwt.secret=c29tZS1zZWNyZXQta2V5LXZlcnktc3Ryb25nLWFuZC1zZWN1cmUtZm9yLWp3dC10b2tlbi1leGFtcGxlCg==
jwt.expiration=3600000

spring.datasource.url=${DB_URL:jdbc:h2:mem:mafia;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
# 로컬(H2)에서는 테이블 자동 생성, 운영 DB에서는 DDL_AUTO=validate 로 실행
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.security.oauth2.resourceserver.jwt.issuer-uri=${JWT_ISSUER_URI:https://issuer.example.invalid}
