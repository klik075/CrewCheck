spring.application.name=WhoisntCitizen_server

# ============================================================
# 공통 설정 (모든 프로필에 적용)
#  - 프로필별 값은 application-{프로필}.properties 에서 덮어쓴다.
#  - local : 로컬 개발 / Postman 테스트 (기본값)
#  - prod  : 실제 서버. 실행 시 --spring.profiles.active=prod 또는 SPRING_PROFILES_ACTIVE=prod
# ============================================================
spring.profiles.default=local

server.port=8080

# JWT
jwt.expiration=3600000

# DB (MySQL). 접속 정보는 환경변수로 바꿀 수 있고, 기본값은 docker-compose.yml 기준
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/mafia?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
spring.datasource.username=${DB_USER:mafia}
spring.datasource.password=${DB_PASSWORD:mafia1234}
# 테이블은 Flyway(src/main/resources/db/migration)가 만든다. Hibernate는 스키마를 건드리지 않는다.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
# 게임 상태 저장소: memory(서버 메모리, 재시작하면 사라짐) 또는 redis(게임 그룹 Redis, 재시작해도 이어짐)
# redis여도 잠금·타이머는 아직 서버 메모리라 서버는 1대만 띄운다. (2·3단계 이후 여러 대 가능)
mafia.game.repository=${GAME_REPOSITORY:memory}
# 게임 그룹 Redis (게임 상태, 이후 게임 잠금, 게임 타이머). 지금은 위의 공용 Redis와 같은 곳을 바라본다.
# 게임용 Redis를 따로 둘 때는 GAME_REDIS_HOST / GAME_REDIS_PORT만 바꾼다. (GameRedisProperties 참고)
mafia.redis.game.host=${GAME_REDIS_HOST:${spring.data.redis.host}}
mafia.redis.game.port=${GAME_REDIS_PORT:${spring.data.redis.port}}
# 잠금 방식: local(서버 메모리, 서버 1대) 또는 redis(Redisson 분산 잠금, 서버 여러 대)
# redis면 서버가 시작할 때 Redis에 바로 접속한다 (Redis가 꺼져 있으면 서버가 뜨지 않음)
# 게임 잠금은 게임 그룹(mafia.redis.game.*), 방 잠금은 로비 그룹(spring.data.redis.*) Redis를 쓴다
mafia.game.lock=${GAME_LOCK:local}
mafia.room.lock=${ROOM_LOCK:local}
# 잠금을 기다리는 최대 시간(밀리초). 넘기면 LockTimeoutException (게임 잠금·방 잠금 공통)
mafia.lock.wait-timeout-millis=10000

# 게임 종료 후 결과 조회를 위해 메모리에 남겨 두는 시간(초)
mafia.phase.ended-retention-seconds=60

# OAuth 2.0 구글 카카오 연동
oauth.google.client-id=${GOOGLE_CLIENT_ID:YOUR_GOOGLE_CLIENT_ID_HERE.apps.googleusercontent.com}
oauth.kakao.user-info-uri=https://kapi.kakao.com/v2/user/me
