spring.application.name=WhoisntCitizen_server

# ============================================================
# 공통 설정 (모든 프로필에 적용)
#  - 프로필별 값은 application-{프로필}.properties 에서 덮어쓴다.
#  - local : 로컬 개발 / Postman 테스트 (기본값)
#  - prod  : 실제 서버. 실행 시 --spring.profiles.active=prod 또는 SPRING_PROFILES_ACTIVE=prod
# ============================================================
spring.profiles.default=local

server.port=8080

# JWT
jwt.expiration=3600000
# 리프레시 토큰 유효 시간(ms): 7일. Redis 키 refresh_token:{memberId}의 TTL로도 쓴다
jwt.refresh-expiration=604800000

# DB (MySQL). 접속 정보는 환경변수로 바꿀 수 있고, 기본값은 docker-compose.yml 기준
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/mafia?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
spring.datasource.username=${DB_USER:mafia}
spring.datasource.password=${DB_PASSWORD:mafia1234}
# 테이블은 Flyway(src/main/resources/db/migration)가 만든다. Hibernate는 스키마를 건드리지 않는다.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
# 서버 모드: single(서버 1대, 저장소·잠금·타이머 전부 서버 메모리) 또는 multi(서버 여러 대, 전부 Redis). 환경변수 SERVER_MODE
# 아래 개별 설정(게임 저장소, 게임 잠금, 방 잠금, 게임 타이머)은 비워 두면 이 모드를 따르고, 값을 넣으면 그 항목만 덮어쓴다.
# 서버가 켜질 때 실제로 쓰는 조합을 로그로 남기고, 서로 안 맞는 조합이면 경고한다. (ServerSettingsCheck)
# 접속 기록은 아직 서버 메모리라 multi여도 서버는 1대만 띄운다. (3.5단계 이후 여러 대 가능)
mafia.server.mode=${SERVER_MODE:single}
# 게임 상태 저장소: memory(서버 메모리, 재시작하면 사라짐) 또는 redis(게임 그룹 Redis, 재시작해도 이어짐)
# 비우면 모드를 따른다 (single → memory, multi → redis). 덮어쓰려면 환경변수 GAME_REPOSITORY
mafia.game.repository=${GAME_REPOSITORY:}
# 게임 그룹 Redis (게임 상태, 게임 잠금, 게임 타이머). 지금은 위의 공용 Redis와 같은 곳을 바라본다.
# 게임용 Redis를 따로 둘 때는 GAME_REDIS_HOST / GAME_REDIS_PORT만 바꾼다. (GameRedisProperties 참고)
mafia.redis.game.host=${GAME_REDIS_HOST:${spring.data.redis.host}}
mafia.redis.game.port=${GAME_REDIS_PORT:${spring.data.redis.port}}
# 잠금 방식: local(서버 메모리, 서버 1대) 또는 redis(Redisson 분산 잠금, 서버 여러 대)
# 비우면 모드를 따른다 (single → local, multi → redis). 덮어쓰려면 환경변수 GAME_LOCK / ROOM_LOCK
# redis면 서버가 시작할 때 Redis에 바로 접속한다 (Redis가 꺼져 있으면 서버가 뜨지 않음)
# 게임 잠금은 게임 그룹(mafia.redis.game.*), 방 잠금은 로비 그룹(spring.data.redis.*) Redis를 쓴다
mafia.game.lock=${GAME_LOCK:}
mafia.room.lock=${ROOM_LOCK:}
# 잠금을 기다리는 최대 시간(밀리초). 넘기면 LockTimeoutException (게임 잠금·방 잠금 공통)
mafia.lock.wait-timeout-millis=10000
# 게임 타이머(페이즈 제한 시간, 끝난 게임 정리): local(서버 메모리 스케줄러, 서버 1대) 또는 redis(game:v1:timers, 서버 여러 대)
# 비우면 모드를 따른다 (single → local, multi → redis). 덮어쓰려면 환경변수 GAME_TIMER
mafia.game.timer=${GAME_TIMER:}
# Redis 타이머 세부 설정 (redis일 때만 쓰임, RedisTimerProperties)
#  - 확인 간격(ms): 페이즈가 이만큼까지 늦게 넘어갈 수 있다. 줄이면 밀린 예약을 빨리 따라잡지만 한가할 때도 자주 Redis에 묻는다
#  - lease(초): 실행 도중 서버가 죽으면 이 시간 뒤 다른 서버가 다시 실행한다
#  - batch-size: 한 번에 가져가는 최대 개수 / workers: 서버 한 대에서 동시에 실행하는 타이머 수(작업 스레드)
mafia.redis.game.timer.poll-interval-millis=100
mafia.redis.game.timer.lease-seconds=30
mafia.redis.game.timer.batch-size=100
mafia.redis.game.timer.workers=4
# 접속 기록(플레이어별 마지막 요청 시각, 연결 끊김 판정): local(서버 메모리, 서버 1대) 또는 redis(game:v1:activity:{gameId}, 서버 여러 대)
# 비우면 모드를 따른다 (single → local, multi → redis). 덮어쓰려면 환경변수 GAME_ACTIVITY
# redis일 때 키 TTL은 진행 중인 게임 키와 같은 mafia.redis.game.active-ttl-seconds를 쓴다
mafia.game.activity=${GAME_ACTIVITY:}
# 실시간 신호(WebSocket 알림) 전달: local(이 서버의 연결에만, 서버 1대) 또는 redis(Redis Pub/Sub으로 모든 서버에, 서버 여러 대)
# 비우면 모드를 따른다 (single → local, multi → redis). 덮어쓰려면 환경변수 REALTIME_NOTIFIER
# redis면 공용 Redis(spring.data.redis.*)의 채널 하나로 주고받는다. 채널은 키가 아니라 저장되지 않는다. (RealtimeRedisConfig)
mafia.realtime.notifier=${REALTIME_NOTIFIER:}
mafia.realtime.redis.channel=realtime:v1:signals
# 서버가 정상 종료하면서 닫은 WebSocket 연결은 접속 상태(친구 목록 온라인 표시)를 바로 지우지 않고 이 시간(초)만 남긴다. (멀티서버 3단계)
# 그 안에 다른 서버로 다시 연결하면 깜빡이지 않고, 다시 연결하지 않으면 이 시간 뒤 오프라인이 된다.
# 클라이언트 재연결 대기(1초, 2초, ±20%)를 넉넉히 덮는 값이다. 사용자가 직접 끊은 연결은 이 값과 상관없이 바로 오프라인
mafia.realtime.shutdown-presence-grace-seconds=10

# ---------- 서버 식별자 · 헬스 체크 · 정상 종료 (멀티서버 2단계) ----------
# 서버 ID: 로그, 응답 헤더 X-Server-Id, 실시간 신호 origin에 쓴다. (common.server.ServerIdentity)
# 운영에서는 서버마다 다르게 넣는다 (예: server-a, server-b). 비우면 "호스트 이름-임의 8자리"로 켤 때마다 만든다.
# 영문·숫자·'.'·'_'·'-'만, 64자 이내. 환경변수 SERVER_ID
mafia.server.id=${SERVER_ID:}
# 정상 종료: 종료 신호(SIGTERM)를 받으면 새 요청을 받지 않고, 처리 중인 요청을 끝까지 마친 뒤 끈다.
# 단계마다 최대 20초 기다린다. (systemd 기본 종료 대기 90초보다 짧아야 한다)
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
# 헬스 체크: /actuator/health 하나만 연다. 다른 actuator 기능(환경변수, 설정 값 등)은 열지 않는다.
#  - /actuator/health/liveness  : 프로세스가 살아 있는가. 앱 상태만 본다 (DB·Redis가 끊겨도 UP → 재시작하지 않음)
#  - /actuator/health/readiness : 요청을 받아도 되는가. DB·Redis까지 본다. 종료가 시작되면 바로 DOWN
#  - 상세 내용(어느 항목이 왜 DOWN인지)은 밖에 보여 주지 않는다. 서버 로그로 본다.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db,redis

# 게임 종료 후 결과 조회를 위해 메모리에 남겨 두는 시간(초)
mafia.phase.ended-retention-seconds=60

# 전적 반영 재시도 (user.service.PendingGameStatsRelay)
#  - 승패가 난 게임의 결과는 끝나는 순간 DB(game_results)에 남는다. 전적은 그 직후 이벤트로 반영하는데,
#    그 사이 서버가 꺼졌거나 반영이 실패한 게임을 서버가 켜질 때와 이 간격(초)마다 찾아 반영한다. 0이면 끈다.
#  - 같은 게임은 몇 번 시도해도(서버 여러 대여도) 전적에 한 번만 반영된다. (game_results.stats_applied_at)
mafia.stats.relay-interval-seconds=30

# 대기실 연결 끊김 처리 (lobby.presence.RoomPresenceService)
#  - 대기실(WAITING 방)에서 활동(방 조회·생성·입장)이 이 시간(초) 동안 없으면 방에서 뺀다. (앱 종료, 강제 종료, 네트워크 끊김 등)
#    방장이면 다음 사람에게 위임, 아무도 없으면 방 삭제. 0이면 끈다. (기록도 남기지 않음)
#  - 서버가 켜진 뒤 이 시간만큼 기다렸다가 첫 검사를 한다. (재시작 직후 다시 연결하려던 사람이 빠지지 않도록)
#  - 접속 기록은 서버 모드와 상관없이 로비 Redis(lobby:v1:presence:{roomId})에 둔다.
#  - Postman으로 방을 만들어 두고 오래 테스트할 때는 0으로 끈다. (Postman은 방을 1초마다 조회하지 않는다)
#  - 45초인 이유: 웹소켓으로 방을 구독 중이면 클라이언트가 방 조회를 15초마다만 한다. (RealtimePolling.SafetyNetSeconds)
#    30초로 두면 조회가 한 번만 실패·지연돼도 멀쩡한 사람이 빠진다. 45초면 15초 조회를 두 번 놓쳐도 버틴다.
#    멀티서버 3단계부터 웹소켓 ping(10초마다)과 방 구독도 대기실 기록에 남는다. (GameActivityRecorder)
#    그래서 이 값을 30초로 다시 줄일 수 있다. 줄이는 것은 서버 여러 대 통합 검증(8단계) 뒤에 정한다.
mafia.lobby.idle-timeout-seconds=45
# 검사 주기(초). 실제로는 활동이 끊긴 지 idle-timeout ~ idle-timeout + idle-check 사이에 빠진다
mafia.lobby.idle-check-seconds=5
# 접속 기록 키 TTL(초). 기록할 때마다 연장된다. 방 삭제 때 키를 못 지운 경우를 대비한 안전장치
mafia.lobby.presence-ttl-seconds=3600

# OAuth 2.0 구글 카카오 연동
oauth.google.client-id=${GOOGLE_CLIENT_ID:58755757454-3jo8nh6sflk5kqdk9frv9rp6ii7eldja.apps.googleusercontent.com}
oauth.kakao.user-info-uri=https://kapi.kakao.com/v2/user/me

# 웹(WebGL) 로그인: 팝업에서 받은 인가 코드를 서버가 토큰으로 교환할 때 쓴다. (모바일 토큰 방식에는 필요 없다)
# 비워 두면 /code 엔드포인트만 실패하고 서버는 정상 시작한다.
oauth.google.client-secret=${GOOGLE_CLIENT_SECRET:}
oauth.google.token-uri=https://oauth2.googleapis.com/token
oauth.kakao.token-uri=https://kauth.kakao.com/oauth/token
oauth.kakao.rest-api-key=${KAKAO_REST_API_KEY:d793a308476a5952e00f1ddd0a2d3820}
oauth.kakao.client-secret=${KAKAO_CLIENT_SECRET:}
# 카카오 Redirect URI 허용 목록(쉼표 구분). 이 서버가 직접 서비스하는 static/kakao-callback.html 주소이고,
# Kakao Developers에 등록한 값과 글자 하나까지 같아야 한다. (로컬 테스트 기본값: 서버 8080)
oauth.kakao.allowed-redirect-uris=${KAKAO_ALLOWED_REDIRECT_URIS:http://localhost:8080/kakao-callback.html}

# 채팅 욕설 검열 (chat.filter.ProfanityFilter). 사용자 메시지의 욕설 부분을 저장 전에 글자 수에 맞는 순화 단어로 바꾼다(마스킹 처리)
#  - 2글자 이하 땡큐 / 3글자 좋아요 / 4글자 좋은친구 / 5글자 감사합니다 / 6글자 이상 사이좋은친구 (chat.filter.ProfanityReplacement)
#  - enabled=false면 검사하지 않는다. [환경변수 CHAT_PROFANITY_ENABLED]
#  - 사전: 한 줄에 한 단어 (# 주석). 금칙어를 품은 정상 단어는 허용어 사전에 넣는다 (예: 시발점)
#    jar 밖 파일을 쓰려면 file:/경로/banned-words.txt 처럼 준다. 사전을 바꾸면 서버를 다시 시작해야 한다
chat.profanity.enabled=${CHAT_PROFANITY_ENABLED:true}
chat.profanity.banned-words=classpath:profanity/banned-words.txt
chat.profanity.allowed-words=classpath:profanity/allowed-words.txt

# 채팅 도배 방지 (chat.spam.ChatSpamGuard). 같은 내용을 연속으로 보내면
#  - warn-at번째부터 보낼 때마다 보낸 사람에게 경고 문구(응답 spamWarning, 주황색)
#  - mute-at번째에는 그 메시지를 막고 mute-seconds초 동안 채팅 금지 (429 CHAT_MUTED, 붉은색 안내)
#  - 같은 내용 사이가 repeat-window-seconds초보다 길거나 다른 내용을 보내면 1부터 다시 센다
#  - store: redis(채팅과 같은 로비 Redis, 서버 여러 대 공유) 또는 memory(서버 메모리)
chat.spam.enabled=${CHAT_SPAM_ENABLED:true}
chat.spam.warn-at=3
chat.spam.mute-at=10
chat.spam.mute-seconds=180
chat.spam.repeat-window-seconds=60
chat.spam.store=redis
