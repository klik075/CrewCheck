spring.application.name=WhoisntCitizen_server

# 테스트 전용: MySQL 없이 H2 메모리 DB(MySQL 호환 모드)로 실행한다.
spring.datasource.url=jdbc:h2:mem:mafia;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# 테스트용 짧은 페이즈 시간
mafia.phase.night-seconds=5
mafia.phase.night-result-seconds=1
mafia.phase.day-seconds=1
mafia.phase.vote-seconds=5
mafia.phase.execution-seconds=1
mafia.phase.ended-retention-seconds=5

# JWT (main 설정과 동일한 테스트 값)
jwt.secret=c29tZS1zZWNyZXQta2V5LXZlcnktc3Ryb25nLWFuZC1zZWN1cmUtZm9yLWp3dC10b2tlbi1leGFtcGxlCg==
jwt.expiration=3600000
# JWT 인증 적용 전까지 비활성화 (SecurityConfig에서 전체 허용 중)
# spring.security.oauth2.resourceserver.jwt.issuer-uri=https://issuer.example.invalid

spring.data.redis.host=localhost
spring.data.redis.port=6379
