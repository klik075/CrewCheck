# 80포트(HTTP): 인증서 발급·갱신 확인(ACME HTTP-01)만 받고, 나머지는 HTTPS로 보낸다.
# docker-compose.prod.yml의 nginx 서비스가 /etc/nginx/conf.d 로 읽는다.
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Let's Encrypt가 "이 도메인이 정말 이 서버인지" 확인하러 오는 주소.
    # certbot이 /var/www/certbot 에 확인용 파일을 만들면 nginx가 그대로 보여 준다.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
